name: Scraper Assurance Repair

on:
  schedule:
    - cron: '0 12 * * *'     # 12:00 UTC daily (after all individual enrichment jobs finish)
  workflow_dispatch:

concurrency:
  group: scraper-assurance-repair
  cancel-in-progress: false

jobs:
  assurance-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 360    # 6 hours max

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Scrapling
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "scrapling[fetchers,shell]"
          scrapling install

      - run: npm ci

      - name: Start dev server
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          npm run dev &
          echo "Waiting for dev server..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000 | grep -qE '200|307|308'; then
              echo "Dev server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run strict queue-driven assurance repair
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCRAPER_RUNNER_BASE_URL: http://127.0.0.1:3000
          SCRAPLING_PYTHON: python3
        run: npm run scrapers:assurance:repair

      - name: Upload assurance artifacts and repair logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-assurance-repair
          path: |
            agents/testscripts/artifacts/scraper-assurance-*.json
            agents/testscripts/artifacts/scraper-health-audit-*.json
            logs/scraper-runs/*.json
          if-no-files-found: ignore
